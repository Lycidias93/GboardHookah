name: Build GboardHookah APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gboardhookah-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate CI-only release signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/AndroidKeystore
          keytool -genkeypair \
            -keystore app/AndroidKeystore/ci-release.jks \
            -storepass ci-test-password \
            -keypass ci-test-password \
            -alias ci-test \
            -dname "CN=GboardHookah CI Test,O=Lycidias93,C=DE" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -noprompt

      - name: Build CI debug and signed release variants
        env:
          GBOARDHOOKAH_RELEASE_KEYSTORE_PATH: AndroidKeystore/ci-release.jks
          GBOARDHOOKAH_RELEASE_STORE_PASSWORD: ci-test-password
          GBOARDHOOKAH_RELEASE_KEY_ALIAS: ci-test
          GBOARDHOOKAH_RELEASE_KEY_PASSWORD: ci-test-password
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK structure and 16 KB native-library ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -c -P 16 -v 4 "$DEBUG_APK"
          "$ZIPALIGN" -c -P 16 -v 4 "$RELEASE_APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

      - name: Upload CI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardHookah-ci-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
