name: Build GboardHookah APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gboardhookah-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build install APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify 16 KB native-library ZIP alignment
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -n "$APK"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: GboardHookah-install-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
