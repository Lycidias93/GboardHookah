import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def keystorePropertiesFile = file("./AndroidKeystore/keystore.properties")
def keystoreProperties = new Properties()
def hasLocalReleaseKeystore = keystorePropertiesFile.exists()

if (hasLocalReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def ciReleaseKeystorePath = System.getenv("GBOARDHOOKAH_RELEASE_KEYSTORE_PATH")
def ciReleaseStorePassword = System.getenv("GBOARDHOOKAH_RELEASE_STORE_PASSWORD")
def ciReleaseKeyAlias = System.getenv("GBOARDHOOKAH_RELEASE_KEY_ALIAS")
def ciReleaseKeyPassword = System.getenv("GBOARDHOOKAH_RELEASE_KEY_PASSWORD")
if (!ciReleaseKeyPassword) {
    ciReleaseKeyPassword = ciReleaseStorePassword
}
def hasCiReleaseSigning = [
    ciReleaseKeystorePath,
    ciReleaseStorePassword,
    ciReleaseKeyAlias,
    ciReleaseKeyPassword
].every { value -> value != null && !value.trim().isEmpty() }
def hasReleaseSigning = hasLocalReleaseKeystore || hasCiReleaseSigning

android {
    compileSdk 31

    defaultConfig {
        applicationId "com.lycidias93.gboardhookah"
        minSdk 23
        targetSdk 31
        versionCode 29
        versionName "1.4.18-hookah.19"
    }

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
        disable 'ExpiredTargetSdkVersion'
    }

    signingConfigs {
        if (hasCiReleaseSigning) {
            release {
                storeFile file(ciReleaseKeystorePath)
                storePassword ciReleaseStorePassword
                keyAlias ciReleaseKeyAlias
                keyPassword ciReleaseKeyPassword
            }
        } else if (hasLocalReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // CI debug artifacts are test builds only. Keep them non-debuggable so
            // Android does not treat normal test installs as debuggable applications.
            debuggable false
        }
        release {
            // Xposed entry points are loaded by class name from assets/xposed_init.
            // Keep the first public stable build behavior aligned with the live-verified
            // non-minified builds instead of introducing an unverified R8 delta.
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def buildType = variant.buildType.name
            def flavor = variant.flavorName ?: ""
            def environment = flavor ? "${flavor}_${buildType}" : buildType
            def date = new Date()
            def sdf = new SimpleDateFormat("yyyyMMdd_HHmmss")
            sdf.setTimeZone(TimeZone.getTimeZone("UTC"))
            def formattedDate = sdf.format(date) + "Z"
            def appName = "GboardHookah"
            def apkName = "${appName}_${environment}_${versionName}_${versionCode}_${formattedDate}.apk"
            output.outputFileName = apkName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    namespace 'com.chenyue404.gboardhook'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    compileOnly project(':xposed-stubs')
    implementation 'org.luckypray:dexkit:2.2.0'
}
